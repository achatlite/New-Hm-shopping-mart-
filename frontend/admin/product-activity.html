<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product Activity · HM Admin</title><link rel="stylesheet" href="/style.css"></head><body><nav class="admin-nav"><div class="admin-nav-inner"><div class="admin-nav-brand">HM SHOPPING MART · ADMIN</div><a href="/admin/products.html" class="active">Manage Products</a><button class="logout" onclick="logout()">Logout</button></div></nav><main class="wrap"><button class="secondary backbtn" onclick="history.back()">← Back</button><h1>Product Activity</h1><p>Database audit history for create, update and delete actions, including date/time.</p><div id="list" class="grid">Loading...</div></main><script>const u=JSON.parse(localStorage.getItem('hm_admin')||'null');const id=new URLSearchParams(location.search).get('id');if(!u||!u.id)location.href='/admin/';function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}function logout(){localStorage.removeItem('hm_admin');location.href='/admin/';}async function load(){try{const r=await fetch('/api/admin/products/'+u.id+'/'+id+'/activity');const d=await r.json();if(!r.ok)throw Error(d.detail||'Unable to load activity');document.getElementById('list').innerHTML=d.length?d.map(x=>`<div class="card"><b>${esc(x.event_type)}</b><p>${esc(x.created_at)}</p><pre style="white-space:pre-wrap">${esc(JSON.stringify(x.details||{},null,2))}</pre></div>`).join(''):'<div class="card">No activity found.</div>'}catch(e){document.getElementById('list').innerHTML='<div class="card">'+esc(e.message)+'</div>'}}load();</script></body></html>
