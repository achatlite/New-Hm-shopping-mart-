<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orders & Delivery · HM Admin</title><link rel="stylesheet" href="/style.css"><style>
.delivery-card{margin-top:20px;padding:18px;border:1px solid #e5e7eb;border-radius:14px;background:#fafafa;box-sizing:border-box}.delivery-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.delivery-grid input,.delivery-grid select{width:100%;min-width:0;box-sizing:border-box}.delivery-actions{margin-top:14px;display:flex;gap:10px;flex-wrap:wrap}.status-select{font-weight:700}.muted{color:#666;font-size:13px;line-height:1.5}.order-admin-card{min-width:0;padding:22px;margin:0;box-sizing:border-box;overflow:hidden}.order-admin-card p{line-height:1.6;overflow-wrap:anywhere}.order-admin-actions{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}.order-items{margin-top:10px}.order-items.show{padding:12px;border:1px solid #e5e7eb;border-radius:10px;background:#fff}.wrap #orderList{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:24px;align-items:start}.wrap #orderList>.order-admin-card{width:100%}@media(max-width:700px){.wrap #orderList{grid-template-columns:1fr;gap:16px}.delivery-grid{grid-template-columns:1fr}.order-admin-card{padding:18px}}
</style></head><body><nav class="admin-nav"><div class="admin-nav-inner"><div class="admin-nav-brand">HM SHOPPING MART · ADMIN</div><a href="/admin/dashboard.html">Dashboard</a><a href="/admin/add-product.html">Add Product</a><a href="/admin/products.html">Manage Products</a><a href="/admin/orders.html" class="active">Orders / Delivery</a><a href="/admin/returns.html">Return Requests</a><button class="logout" onclick="logout()">Logout</button></div></nav><main class="wrap"><div class="admin-head"><div><h1>Orders & Delivery</h1><p>Manage the complete customer delivery journey and live tracking checkpoints.</p></div></div><div id="orderList" class="grid"><div class="empty">Loading customer orders...</div></div></main><script>
const u=JSON.parse(localStorage.getItem('hm_admin')||'null');if(!u||!u.id)location.href='/admin/';
const STATUSES=[['pending','Order received'],['packed','Packed'],['shipped','Shipped'],['out_for_delivery','Out for delivery'],['delivered','Delivered'],['returned','Returned']];
function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}
function logout(){localStorage.removeItem('hm_admin');location.href='/admin/'}
function fmt(v){return v?new Date(String(v).replace(' ','T')+'Z').toLocaleString('en-IN'):'Not recorded'}
function options(selected){return STATUSES.map(([v,l])=>`<option value="${v}" ${String(selected||'pending')===v?'selected':''}>${l}</option>`).join('')}
async function load(){const box=document.getElementById('orderList');try{const r=await fetch('/api/admin/orders/'+u.id);const data=await r.json();if(!r.ok)throw Error(data.detail||'Unable to load orders');if(!data.length){box.innerHTML='<div class="empty">No customer orders found.</div>';return}box.innerHTML=data.map(o=>`<div class="card order-admin-card"><h3>${esc(o.order_number||'')}</h3><p><b>Customer:</b> ${esc(o.customer_name||'')} · ${esc(o.customer_email||'')}</p><p><b>Total:</b> ₹${Number(o.total_amount||0).toFixed(2)} · <b>Payment:</b> ${esc(o.payment_status||'')}</p><p><b>Order:</b> ${esc(o.status||'')} · <b>Shipment:</b> ${esc(o.shipment_status||'pending')}</p><p>${o.carrier?esc(o.carrier)+' · ':''}${o.tracking_number?'Tracking: '+esc(o.tracking_number):'Tracking not assigned'}</p><div class="order-admin-actions"><button class="secondary" onclick="location.href='/admin/order-details.html?id=${Number(o.id)}'">Track / View Details</button><button class="secondary" onclick="toggleItems(${Number(o.id)})">View Items</button></div><div id="items-${Number(o.id)}" class="order-items"></div><div class="delivery-card"><h3 style="margin-top:0">🚚 Delivery update</h3><p class="muted">Set the current carrier, tracking number, location and expected delivery. Each update becomes a tracking checkpoint for the customer.</p><div class="delivery-grid"><input id="carrier-${o.id}" placeholder="Carrier" value="${esc(o.carrier||'')}"><input id="tracking-${o.id}" placeholder="Tracking number" value="${esc(o.tracking_number||'')}"><input id="city-${o.id}" placeholder="Current city" value="${esc(o.current_city||'')}"><input id="location-${o.id}" placeholder="Current location / hub" value="${esc(o.current_location||'')}"><input id="eta-${o.id}" type="datetime-local" value="${o.estimated_delivery?String(o.estimated_delivery).replace(' ','T').slice(0,16):''}"><select id="shipment-${o.id}" class="status-select">${options(o.shipment_status)}</select></div><div class="delivery-actions"><button onclick="updateShipment(${o.id})">Save Delivery Update</button><button class="secondary" onclick="location.href='/admin/order-details.html?id=${o.id}'">Open Full Tracking</button></div></div></div>`).join('')}catch(e){box.innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
async function toggleItems(id){const b=document.getElementById('items-'+id);if(b.classList.contains('show')){b.classList.remove('show');return}try{const r=await fetch('/api/admin/orders/'+u.id+'/'+id+'/items');const d=await r.json();if(!r.ok)throw Error(d.detail||'Unable to load items');b.innerHTML=d.length?d.map(i=>`<div><b>${esc(i.product_name||'')}</b> · SKU ${esc(i.sku||'')} · Qty ${Number(i.quantity||0)} · ₹${Number(i.total_amount||0).toFixed(2)}</div>`).join(''):'No items found.';b.classList.add('show')}catch(e){b.textContent=e.message;b.classList.add('show')}}
async function updateShipment(id){const payload={carrier:document.getElementById('carrier-'+id).value.trim()||null,tracking_number:document.getElementById('tracking-'+id).value.trim()||null,status:document.getElementById('shipment-'+id).value,current_city:document.getElementById('city-'+id).value.trim()||null,current_location:document.getElementById('location-'+id).value.trim()||null,estimated_delivery:document.getElementById('eta-'+id).value||null};try{const r=await fetch('/api/admin/shipments/'+u.id+'/'+id,{method:'PUT',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify(payload)});const text=await r.text();let x={};try{x=text?JSON.parse(text):{}}catch(_){x={detail:text||'Server returned an invalid response'}}if(!r.ok)throw Error(x.detail||x.message||'Shipment update failed');alert(x.message||'Delivery update saved');load()}catch(e){alert(e.message)}}load();
</script></body></html>
