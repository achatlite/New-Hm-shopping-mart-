<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Return Requests · HM Admin</title><link rel="stylesheet" href="/style.css"></head><body><nav class="admin-nav"><div class="admin-nav-inner"><div class="admin-nav-brand">HM SHOPPING MART · ADMIN</div><a href="/admin/dashboard.html" class="">Dashboard</a><a href="/admin/add-product.html" class="">Add Product</a><a href="/admin/products.html" class="">Manage Products</a><a href="/admin/orders.html" class="">Orders / Delivery</a><a href="/admin/returns.html" class="active">Return Requests</a><button class="logout" onclick="logout()">Logout</button></div></nav><main class="wrap"><div class="admin-head"><div><h1>Return Requests</h1><p>Review, approve, reject, receive and refund customer returns.</p></div></div><div id="returnList" class="grid"><div class="empty">Loading return requests...</div></div></main><script>
const u=JSON.parse(localStorage.getItem('hm_admin')||'null');if(!u||!u.id)location.href='/admin/';function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}function logout(){localStorage.removeItem('hm_admin');location.href='/admin/';}

async function load(){const box=document.getElementById('returnList');try{const r=await fetch('/api/admin/returns/'+u.id);const data=await r.json();if(!r.ok)throw Error(data.detail||'Load failed');if(!data.length){box.innerHTML='<div class="empty">No return requests found.</div>';return}box.innerHTML=data.map(render).join('')}catch{box.innerHTML='<div class="empty">Unable to load return requests.</div>'}}function render(rr){const st=String(rr.status||'requested').toLowerCase(),refund=Number(rr.refund_amount||0);return `<article class="product return-admin-card"><h3>↩ Return #${Number(rr.id)}</h3><p><b>Order:</b> ${esc(rr.order_number||'-')}</p><p><b>Product:</b> ${esc(rr.product_name||'-')}</p><p><b>SKU:</b> ${esc(rr.sku||'-')}</p><p><b>Customer:</b> ${esc(rr.customer_name||'-')} · ${esc(rr.customer_email||'-')}</p><p><b>Phone:</b> ${esc(rr.customer_phone||'-')}</p><p><b>Quantity:</b> ${Number(rr.quantity||0)}</p><p><b>Reason:</b> ${esc(rr.reason||'No reason provided')}</p><p><b>Status:</b> <span class="return-status">${esc(st.toUpperCase())}</span></p><p class="refund-amount">Refund: ₹${refund.toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2})}</p><label>Admin Note</label><textarea id="note-${rr.id}">${esc(rr.admin_note||'')}</textarea><div class="return-actions"><select id="status-${rr.id}">${['requested','approved','rejected','received','refunded','cancelled'].map(x=>`<option value="${x}" ${x===st?'selected':''}>${x.toUpperCase()}</option>`).join('')}</select><input id="refund-${rr.id}" type="number" min="0" step="0.01" value="${refund.toFixed(2)}"><button onclick="processReturn(${Number(rr.id)})">Update Return</button></div></article>`}async function processReturn(id){const status=document.getElementById('status-'+id).value,refund=Number(document.getElementById('refund-'+id).value||0),note=document.getElementById('note-'+id).value.trim();if(refund<0||(status==='refunded'&&refund<=0)){alert('Valid refund amount enter karo.');return}if(!confirm('Return #'+id+' ko '+status.toUpperCase()+' karna hai?'))return;try{const r=await fetch('/api/admin/returns/'+u.id+'/'+id,{method:'PUT',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({status,admin_note:note||null,refund_amount:refund})});const x=await r.json();if(!r.ok)throw Error(x.detail||'Update failed');alert(x.message||'Return updated successfully');load()}catch(e){alert(e.message)}}load();
</script></body></html>
