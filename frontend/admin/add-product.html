<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Add Product · HM Admin</title><link rel="stylesheet" href="/style.css"></head><body><nav class="admin-nav"><div class="admin-nav-inner"><div class="admin-nav-brand">HM SHOPPING MART · ADMIN</div><a href="/admin/dashboard.html" class="">Dashboard</a><a href="/admin/add-product.html" class="active">Add Product</a><a href="/admin/products.html" class="">Manage Products</a><a href="/admin/orders.html" class="">Orders / Delivery</a><a href="/admin/returns.html" class="">Return Requests</a><button class="logout" onclick="logout()">Logout</button></div></nav><main class="wrap"><div class="admin-head"><div><h1 id="formTitle">Add My Product</h1><p>Create or edit products owned by this admin.</p></div></div><div class="card admin-form"><div class="two"><div><label>Product Name</label><input id="name" placeholder="e.g. Men's Running Shoes"></div><div><label>SKU</label><input id="sku" placeholder="Unique SKU"></div></div><div class="two"><div><label>Category</label><select id="cat"><option value="">Select category</option></select></div><div><label>Brand</label><input id="brandName" placeholder="Brand (optional)"></div></div><div class="two"><div><label>Product Image URL</label><input id="imageUrl" type="text" placeholder="Paste any image URL (Google Images / CDN / website image link)" oninput="previewImage()"><small style="display:block;margin-top:6px;color:#666">Any URL is accepted and stored. If the URL is not a direct image, the browser may not render it.</small></div><div><label>Image Preview</label><div id="imagePreview" style="min-height:120px;border:1px dashed #ccc;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:8px;color:#777">No image selected</div></div></div><div class="three"><div><label>MRP (₹)</label><input id="mrp" type="number" min="0" step="0.01" oninput="syncDiscount()"></div><div><label>Discount (%)</label><input id="discount" type="number" min="0" max="100" step="0.01" oninput="syncPriceFromDiscount()"></div><div><label>Selling Price (₹)</label><input id="price" type="number" min="0" step="0.01" oninput="syncDiscountFromPrice()"></div></div><label>Stock Quantity</label><input id="stock" type="number" min="0" value="0"><label>Full Product Description</label><textarea id="desc" placeholder="Product details, features, material, size, warranty, etc."></textarea><div class="form-actions"><button type="button" onclick="save()" id="saveBtn">Save Product</button><button type="button" class="secondary" onclick="clearForm()">Clear</button></div></div></main><script>
const u=JSON.parse(localStorage.getItem('hm_admin')||'null');if(!u||!u.id)location.href='/admin/';function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}function logout(){localStorage.removeItem('hm_admin');location.href='/admin/';}

let editing=null;const nameInput=document.getElementById('name'),skuInput=document.getElementById('sku'),catInput=document.getElementById('cat'),brandInput=document.getElementById('brandName'),imageUrlInput=document.getElementById('imageUrl'),imagePreview=document.getElementById('imagePreview'),mrpInput=document.getElementById('mrp'),discountInput=document.getElementById('discount'),priceInput=document.getElementById('price'),stockInput=document.getElementById('stock'),descInput=document.getElementById('desc'),formTitle=document.getElementById('formTitle'),saveBtn=document.getElementById('saveBtn');async function init(){const r=await fetch('/api/categories');if(!r.ok)throw Error();const cats=await r.json();catInput.innerHTML='<option value="">Select category</option>'+cats.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');const pid=new URLSearchParams(location.search).get('edit');if(pid)await editProduct(pid)}init().catch(()=>alert('Category data load nahi hua.'));function syncPriceFromDiscount(){let m=Number(mrpInput.value||0),d=Math.min(100,Math.max(0,Number(discountInput.value||0)));discountInput.value=d;if(m>0)priceInput.value=(m*(1-d/100)).toFixed(2)}function syncDiscountFromPrice(){let m=Number(mrpInput.value||0),p=Number(priceInput.value||0);if(m>0&&p>=0&&p<=m)discountInput.value=(((m-p)*100)/m).toFixed(2)}function syncDiscount(){if(Number(mrpInput.value||0)>0&&Number(discountInput.value||0)>0)syncPriceFromDiscount();else if(Number(mrpInput.value||0)>0&&Number(priceInput.value||0)>0)syncDiscountFromPrice()}function previewImage(){const url=imageUrlInput.value.trim();if(!url){imagePreview.innerHTML='No image selected';return}imagePreview.innerHTML=`<img src="${esc(url)}" alt="Preview" style="max-width:100%;max-height:180px;border-radius:6px;object-fit:contain" onerror="this.parentElement.innerHTML='Unable to preview image URL'">`}function clearForm(){editing=null;formTitle.textContent='Add My Product';saveBtn.textContent='Save Product';skuInput.disabled=false;[nameInput,skuInput,brandInput,imageUrlInput,mrpInput,discountInput,priceInput,descInput].forEach(x=>x.value='');catInput.value='';stockInput.value='0';previewImage()}async function editProduct(id){const r=await fetch('/api/admin/products/'+u.id);const ps=await r.json();const p=ps.find(x=>Number(x.id)===Number(id));if(!p){alert('Product not found.');return}editing=p;formTitle.textContent='Edit My Product';saveBtn.textContent='Update Product';nameInput.value=p.name||'';skuInput.value=p.sku||'';skuInput.disabled=true;catInput.value=p.category_id||'';brandInput.value=p.brand||'';mrpInput.value=p.mrp??'';discountInput.value=p.discount_percent??0;priceInput.value=p.price??'';stockInput.value=p.stock_quantity??0;descInput.value=p.description||'';imageUrlInput.value=p.image_url||'';previewImage()}async function save(){const body={name:nameInput.value.trim(),sku:skuInput.value.trim(),category_id:Number(catInput.value),brand_id:null,description:descInput.value.trim()||null,price:Number(priceInput.value),mrp:Number(mrpInput.value),discount_percent:Number(discountInput.value||0),stock_quantity:Math.floor(Number(stockInput.value||0)),tax_percent:0,status:'active',image_url:imageUrlInput.value.trim()||null};if(!body.name||!body.sku||!body.category_id||!Number.isFinite(body.mrp)||body.mrp<=0||!Number.isFinite(body.price)||body.price<0||body.price>body.mrp||body.discount_percent<0||body.discount_percent>100||body.stock_quantity<0){alert('Please enter valid product details.');return}saveBtn.disabled=true;try{const url=editing?'/api/admin/products/'+u.id+'/'+editing.id:'/api/admin/products/'+u.id;const r=await fetch(url,{method:editing?'PUT':'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify(body)});const text=await r.text();let x={};try{x=text?JSON.parse(text):{}}catch(_){x={detail:text||'Server returned an invalid response'}}if(!r.ok)throw Error(x.detail||x.message||'Save failed');alert(x.message||(editing?'Product updated successfully':'Product added successfully'));if(editing){location.href='/admin/products.html'}else clearForm()}catch(e){alert(e.message||'Save failed')}finally{saveBtn.disabled=false}}</script></body></html>
