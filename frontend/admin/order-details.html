<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Order Details & Tracking · HM Admin</title><link rel="stylesheet" href="/style.css"><style>.detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}.detail-card{padding:16px}.timeline{border-left:3px solid #ddd;margin:18px 0;padding-left:18px}.event{margin:0 0 18px;position:relative}.event:before{content:'';position:absolute;left:-26px;top:4px;width:10px;height:10px;border-radius:50%;background:#222}.pill{display:inline-block;padding:4px 9px;border-radius:12px;background:#eee;font-size:12px}.kv{margin:7px 0}.kv b{display:inline-block;min-width:150px}.back{margin-bottom:15px}</style></head><body><nav class="admin-nav"><div class="admin-nav-inner"><div class="admin-nav-brand">HM SHOPPING MART · ADMIN</div><a href="/admin/dashboard.html">Dashboard</a><a href="/admin/add-product.html">Add Product</a><a href="/admin/products.html">Manage Products</a><a href="/admin/orders.html" class="active">Orders / Delivery</a><a href="/admin/returns.html">Return Requests</a><button class="logout" onclick="logout()">Logout</button></div></nav><main class="wrap"><div class="back"><a href="/admin/orders.html">← Back to Orders</a></div><div id="app"><div class="empty">Loading order details...</div></div></main><script>
const u=JSON.parse(localStorage.getItem('hm_admin')||'null');if(!u||!u.id)location.href='/admin/';function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}function logout(){localStorage.removeItem('hm_admin');location.href='/admin/'}
const id=Number(new URLSearchParams(location.search).get('id'));const fmt=v=>v?new Date(v).toLocaleString():'—';const money=v=>'₹'+Number(v||0).toFixed(2);
async function load(){const box=document.getElementById('app');if(!id){box.innerHTML='<div class="empty">Invalid order ID.</div>';return}try{const r=await fetch('/api/admin/orders/'+u.id+'/'+id+'/details');const d=await r.json();if(!r.ok)throw Error(d.detail||'Unable to load order');const o=d.order;box.innerHTML=`<div class="admin-head"><div><h1>Order ${esc(o.order_number)}</h1><p>Order ID: ${esc(o.id)} · Created: ${esc(fmt(o.created_at))}</p></div></div><div class="detail-grid"><div class="card detail-card"><h3>Customer</h3><div class="kv"><b>Name</b>${esc(o.customer_name)}</div><div class="kv"><b>Email</b>${esc(o.customer_email)}</div><div class="kv"><b>Phone</b>${esc(o.customer_phone)}</div></div><div class="card detail-card"><h3>Payment</h3><div class="kv"><b>Order Payment</b><span class="pill">${esc(o.payment_status)}</span></div><div class="kv"><b>Payment Record</b>${esc(o.payment_record_status||'—')}</div><div class="kv"><b>Provider</b>${esc(o.provider||'—')}</div><div class="kv"><b>Transaction</b>${esc(o.transaction_id||'—')}</div><div class="kv"><b>Amount</b>${money(o.payment_amount||o.total_amount)}</div><div class="kv"><b>Paid At</b>${esc(fmt(o.paid_at))}</div></div><div class="card detail-card"><h3>Delivery</h3><div class="kv"><b>Order Status</b>${esc(o.status)}</div><div class="kv"><b>Shipment Status</b>${esc(o.shipment_status||'pending')}</div><div class="kv"><b>Carrier</b>${esc(o.carrier||'—')}</div><div class="kv"><b>Tracking</b>${esc(o.tracking_number||'—')}</div><div class="kv"><b>Current City</b>${esc(o.current_city||'—')}</div><div class="kv"><b>Current Location / Hub</b>${esc(o.current_location||'—')}</div><div class="kv"><b>Expected Delivery</b>${esc(fmt(o.estimated_delivery))}</div><div class="kv"><b>Shipped</b>${esc(fmt(o.shipped_at))}</div><div class="kv"><b>Delivered</b>${esc(fmt(o.delivered_at))}</div></div><div class="card detail-card"><h3>Totals</h3><div class="kv"><b>Subtotal</b>${money(o.subtotal)}</div><div class="kv"><b>Discount</b>${money(o.discount_amount)}</div><div class="kv"><b>Tax</b>${money(o.tax_amount)}</div><div class="kv"><b>Shipping</b>${money(o.shipping_amount)}</div><div class="kv"><b>Total</b><strong>${money(o.total_amount)}</strong></div></div></div><div class="card" style="margin-top:16px"><h2>Products & Admin Ownership</h2>${d.items.length?d.items.map(i=>`<div class="card" style="margin:10px 0"><div class="kv"><b>Product</b>${esc(i.product_name)}</div><div class="kv"><b>Product ID</b>${esc(i.product_id)}</div><div class="kv"><b>SKU</b>${esc(i.sku)}</div><div class="kv"><b>Quantity</b>${esc(i.quantity)}</div><div class="kv"><b>Unit Price</b>${money(i.unit_price)}</div><div class="kv"><b>Line Total</b>${money(i.total_amount)}</div><div class="kv"><b>Added By Admin</b>${esc(i.product_admin_name||'Unknown')}${i.product_admin_email?' · '+esc(i.product_admin_email):''} ${i.product_admin_id?'(ID '+esc(i.product_admin_id)+')':''}</div></div>`).join(''):'<p>No order items found.</p>'}</div><div class="card" style="margin-top:16px"><h2>Delivery Address</h2><p>${esc(o.recipient_name)} · ${esc(o.recipient_phone)}</p><p>${esc(o.address_line1)}${o.address_line2?', '+esc(o.address_line2):''}, ${esc(o.city)}, ${esc(o.state)} - ${esc(o.postal_code)}, ${esc(o.country)}</p></div><div class="card" style="margin-top:16px"><h2>Return / Refund</h2>${d.returns.length?d.returns.map(x=>`<div class="card" style="margin:10px 0"><div class="kv"><b>Return Request</b>${esc(x.return_request_id)}</div><div class="kv"><b>Order Item</b>${esc(x.order_item_id)}</div><div class="kv"><b>Status</b>${esc(x.return_status)}</div><div class="kv"><b>Quantity</b>${esc(x.quantity)}</div><div class="kv"><b>Refund</b>${money(x.refund_amount)}</div><div class="kv"><b>Reason</b>${esc(x.reason)}</div><div class="kv"><b>Processed</b>${esc(fmt(x.processed_at))}</div><div class="kv"><b>Admin</b>${esc(x.admin_name||'—')} ${x.admin_email?'· '+esc(x.admin_email):''}</div></div>`).join(''):'<p>No return request for this order.</p>'}</div><div class="card" style="margin-top:16px"><h2>Delivery Journey</h2><div class="timeline">${d.shipment_events&&d.shipment_events.length?d.shipment_events.map(e=>`<div class="event"><strong>${esc(e.status)}</strong> <span class="pill">${esc(fmt(e.created_at))}</span><div>${esc(e.city||'Location not updated')}${e.location?' · '+esc(e.location):''}</div><div>${esc(e.note||'Shipment checkpoint recorded')}</div></div>`).join(''):'<p>No delivery checkpoints recorded yet.</p>'}</div></div><div class="card" style="margin-top:16px"><h2>Complete Activity Timeline</h2><div class="timeline">${d.events.length?d.events.map(e=>{const z=e.details||{};const actor=e.admin_name?`Admin: ${esc(e.admin_name)}${e.admin_email?' · '+esc(e.admin_email):''}`:(e.user_name?`Customer: ${esc(e.user_name)}${e.user_email?' · '+esc(e.user_email):''}`:'System');return `<div class="event"><strong>${esc(e.event_type)}</strong> <span class="pill">${esc(fmt(e.created_at))}</span><div>${actor}</div><div>${Object.entries(z).filter(([k])=>!['card_number','cvv','expiry'].includes(k)).map(([k,v])=>`<div class="kv"><b>${esc(k.replaceAll('_',' '))}</b>${esc(v)}</div>`).join('')}</div></div>`}).join(''):'<p>No recorded business activity yet. Current order data is shown above.</p>'}</div></div>`}catch(e){box.innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}load();
</script></body></html>
