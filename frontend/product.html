<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product Details · HM Shopping Mart</title><link rel="stylesheet" href="/style.css"><style>.detail{display:grid;grid-template-columns:minmax(280px,1fr) minmax(300px,1fr);gap:28px;align-items:start}.detail-img{min-height:360px;display:flex;align-items:center;justify-content:center;background:#fafafa;border-radius:14px;padding:18px}.detail-img img{max-width:100%;max-height:520px;object-fit:contain}.detail-card{padding:24px}.price-big{font-size:30px;font-weight:800}.spec{padding:10px 0;border-bottom:1px solid #eee}@media(max-width:760px){.detail{grid-template-columns:1fr}}</style></head><body><main class="wrap"><button class="secondary backbtn" onclick="history.back()">← Back</button><div id="box" class="detail"><div class="card">Loading product...</div></div></main><script>const id=new URLSearchParams(location.search).get('id');const esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');async function load(){if(!id)return show('Product not found');try{const r=await fetch('/api/products/'+encodeURIComponent(id));const p=await r.json();if(!r.ok)throw Error(p.detail||'Product not found');const img=p.image_url?`<img src="${esc(p.image_url)}" alt="${esc(p.name)}" onerror="this.outerHTML='<div style=&quot;font-size:90px&quot;>🛍️</div>'">`:'<div style="font-size:90px">🛍️</div>';const stock=Number(p.stock_quantity||0);document.title=p.name+' · HM Shopping Mart';document.getElementById('box').innerHTML=`<div class="card detail-img">${img}</div><div class="card detail-card"><div class="tag">${esc(p.category||'')}</div><h1>${esc(p.name)}</h1><p><b>Brand:</b> ${esc(p.brand||'HM Shopping Mart')}</p><div class="price-big">₹${Number(p.price||0).toLocaleString('en-IN')} ${Number(p.mrp||0)>Number(p.price||0)?`<del style="font-size:18px">₹${Number(p.mrp).toLocaleString('en-IN')}</del>`:''}</div><p><b>${Number(p.discount_percent||0)}% OFF</b> · ${stock>0?'In Stock':'Out of Stock'}</p><div class="spec"><b>SKU:</b> ${esc(p.sku)}</div><div class="spec"><b>Stock:</b> ${stock}</div><div class="spec"><b>Description:</b><br>${esc(p.description||'No description available.')}</div><br>${stock>0?`<button onclick="buy()">Buy Now</button><button class="outline" onclick="cart()">Add to Cart</button>`:'<button disabled>Out of Stock</button>'}</div>`}catch(e){show(e.message)}}function show(t){document.getElementById('box').innerHTML='<div class="card">'+esc(t)+'</div>'}function buy(){location.href='/checkout.html?product='+encodeURIComponent(id)}async function cart(){const u=JSON.parse(localStorage.getItem('hm_user')||'null');if(!u||!u.id){location.href='/login.html?next='+encodeURIComponent(location.pathname+location.search);return}try{const r=await fetch('/api/cart/'+u.id,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({product_id:Number(id),quantity:1})});const x=await r.json();if(!r.ok)throw Error(x.detail||'Unable to add to cart');alert('Product added to cart.')}catch(e){alert(e.message)}}load();</script></body></html>
